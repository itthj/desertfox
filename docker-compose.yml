# ==============================================================================
# DesertFox Docker Compose — Distributed OSINT Architecture
# ==============================================================================
#
# Services:
#   1. desertfox: FastAPI Web Application & Cyber-OSINT HUD
#   2. redis: Broker & Results Backend for Distributed Crawling
#   3. celery-worker: Distributed asynchronous image crawler & biometric indexer
#   4. model-downloader (profile): Pulls ONNX SCRFD & ArcFace weights
#
# Usage:
#   docker compose up -d                  # Start web app, redis & celery worker
#   docker compose --profile models up    # Download models and start full stack
#   docker compose down                   # Graceful shutdown
#
# Cyber-OSINT HUD: http://localhost:8000
# ==============================================================================

services:
  # In-Memory Message Broker & Result Store
  redis:
    image: redis:7-alpine
    container_name: desertfox-redis
    ports:
      - "6379:6379"
    volumes:
      - desertfox-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web API & Cyber-OSINT HUD
  desertfox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desertfox-engine
    ports:
      - "8000:8000"
    volumes:
      - desertfox-data:/app/data
      - desertfox-models:/app/desertfox/models/weights
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DESERTFOX_REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Distributed Asynchronous Crawler Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desertfox-crawler-worker
    volumes:
      - desertfox-data:/app/data
      - desertfox-models:/app/desertfox/models/weights
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DESERTFOX_REDIS_HOST=redis
      - DESERTFOX_INDEX_PATH=/app/data/desertfox.index
      - CELERY_WORKER_CONCURRENCY=4
    command: ["celery", "-A", "desertfox.queue.celery_app", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional one-shot model downloader
  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desertfox-model-downloader
    profiles:
      - models
    volumes:
      - desertfox-models:/app/desertfox/models/weights
    command: ["python3", "-m", "desertfox.models.download", "--model", "all"]

volumes:
  desertfox-data:
    driver: local
  desertfox-models:
    driver: local
  desertfox-redis-data:
    driver: local
